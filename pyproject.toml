[project]
name = "pysteinthin"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Congye Wang", email = "congye.wang@outlook.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cmake>=3.31.1",
    "numpy>=2.1.3",
    "pybind11>=2.13.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pysteinthin"]

[dependency-groups]
dev = [
    "ipython>=8.30.0",
    "jupyter>=1.1.1",
    "pandas>=2.2.3",
]
